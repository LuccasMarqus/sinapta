<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - Sinapta</title>
<meta name="description" content="Insights da Fronteira - Artigos sobre tecnologia, negócios e inovação pela Sinapta.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script>
tailwind.config = {
    theme: {
        extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
            colors: {
                'primary': '#5B8DEF',
                'on-primary': '#FFFFFF',
                'surface': '#0F172A',
                'surface-container-low': '#0A1122',
                'surface-container-high': '#1E293B',
                'surface-container-highest': '#334155',
                'surface-bright': '#2D3B50',
                'on-surface': '#E2E8F0',
                'on-surface-variant': '#94A3B8',
                'outline-variant': '#475569',
                'secondary': '#F97316',
                'background': '#060E1F',
            }
        }
    }
}
</script>
<style>
    body { background: #060E1F; color: #E2E8F0; }
    .prose h2 { font-size: 1.5rem; font-weight: 800; margin: 2rem 0 1rem; color: #E2E8F0; }
    .prose h3 { font-size: 1.25rem; font-weight: 700; margin: 1.5rem 0 0.75rem; color: #E2E8F0; }
    .prose p { margin: 1rem 0; line-height: 1.8; color: #94A3B8; }
    .prose ul, .prose ol { margin: 1rem 0; padding-left: 1.5rem; color: #94A3B8; }
    .prose li { margin: 0.5rem 0; line-height: 1.7; }
    .prose ul li { list-style-type: disc; }
    .prose ol li { list-style-type: decimal; }
    .prose strong { color: #E2E8F0; font-weight: 700; }
    .prose em { font-style: italic; }
    .prose blockquote { border-left: 4px solid #5B8DEF; padding: 1rem 1.5rem; margin: 1.5rem 0; background: rgba(91,141,239,0.05); border-radius: 0 12px 12px 0; }
    .prose code { background: #1E293B; padding: 2px 6px; border-radius: 4px; font-size: 0.875rem; color: #5B8DEF; }
    .prose pre { background: #1E293B; padding: 1.25rem; border-radius: 12px; overflow-x: auto; margin: 1.5rem 0; border: 1px solid #334155; }
    .prose pre code { background: none; padding: 0; }
    .prose a { color: #5B8DEF; text-decoration: underline; }
    .prose hr { border-color: #334155; margin: 2rem 0; }
</style>
</head>
<body class="font-sans antialiased">

<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-outline-variant/10">
    <div class="max-w-7xl mx-auto px-5 sm:px-6 lg:px-12 flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-3">
            <img src="" class="dynamic-logo h-8 w-auto object-contain hidden" alt="Logo">
            <span class="dynamic-logo-text text-xl font-black text-white">SINAPTA</span>
        </a>
        <a href="index.html" class="text-sm text-slate-400 hover:text-primary flex items-center gap-2 transition-colors">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Voltar ao site
        </a>
    </div>
</header>

<!-- Blog List View -->
<main id="blog-list-view">
    <div class="pt-32 pb-20 max-w-7xl mx-auto px-5 sm:px-6 lg:px-12">
        <div class="text-center mb-16">
            <h1 class="text-4xl lg:text-5xl font-black mb-4">Insights da Fronteira</h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">Artigos, análises e tendências sobre tecnologia, negócios e inovação digital.</p>
        </div>
        <div id="blog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards dinâmicos -->
        </div>
        <div id="blog-empty" class="hidden text-center py-20 text-slate-500">
            <span class="material-symbols-outlined text-6xl mb-4 block">article</span>
            <p class="text-lg">Nenhum artigo publicado ainda.</p>
        </div>
    </div>
</main>

<!-- Article Detail View -->
<main id="blog-article-view" class="hidden">
    <div class="pt-24 pb-20">
        <!-- Hero Image -->
        <div id="article-hero" class="w-full h-64 md:h-96 bg-surface-container-high relative overflow-hidden mb-0">
            <img id="article-hero-img" src="" class="w-full h-full object-cover" alt="">
            <div class="absolute inset-0 bg-gradient-to-t from-background via-background/50 to-transparent"></div>
        </div>
        <div class="max-w-3xl mx-auto px-5 sm:px-6 lg:px-12 -mt-20 relative z-10">
            <div class="mb-6 flex items-center gap-3">
                <span id="article-tag" class="text-[10px] font-black bg-primary/10 text-primary px-3 py-1 rounded-full uppercase tracking-wider"></span>
                <span id="article-date" class="text-xs text-slate-500"></span>
            </div>
            <h1 id="article-title" class="text-3xl lg:text-4xl font-black mb-6 leading-tight"></h1>
            <p id="article-summary" class="text-lg text-slate-400 mb-10 leading-relaxed border-l-4 border-primary/30 pl-6"></p>
            <div id="article-content" class="prose max-w-none"></div>
            <div class="mt-16 pt-10 border-t border-outline-variant/10">
                <button onclick="showBlogList()" class="text-primary font-bold flex items-center gap-2 hover:gap-4 transition-all">
                    <span class="material-symbols-outlined">arrow_back</span> Voltar para todos os artigos
                </button>
            </div>
        </div>
    </div>
</main>

<!-- Footer Mini -->
<footer class="bg-[#050D1A] py-8 border-t border-outline-variant/10">
    <div class="max-w-7xl mx-auto px-5 sm:px-6 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="text-slate-500 text-xs">© 2024 Sinapta. Todos os direitos reservados.</p>
        <a href="index.html" class="text-slate-500 text-xs hover:text-primary transition-colors">Voltar ao site principal</a>
    </div>
</footer>

<script>
    const SUPABASE_URL = 'https://euybkvjsqfzjojhnquqo.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1eWJrdmpzcWZ6am9qaG5xdXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODg0MTYsImV4cCI6MjA4OTc2NDQxNn0.Hx9qp8gS7lTqy0BoxWanJjXMUfFUADiHJm6xLVViSFc';

    let blogPosts = [];

    // Simple markdown to HTML converter
    function mdToHtml(md) {
        if (!md) return '<p class="text-slate-500 italic">Conteúdo do artigo em breve...</p>';
        let html = md
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h2>$1</h2>')
            .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/gim, '<em>$1</em>')
            .replace(/`(.*?)`/gim, '<code>$1</code>')
            .replace(/^\> (.*$)/gim, '<blockquote><p>$1</p></blockquote>')
            .replace(/^---$/gim, '<hr>')
            .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank">$1</a>')
            .replace(/^\- (.*$)/gim, '<li>$1</li>')
            .replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
        // Wrap consecutive <li> in <ul>
        html = html.replace(/(<li>.*<\/li>\n?)+/gim, function(match) {
            return '<ul>' + match + '</ul>';
        });
        // Wrap remaining lines into <p>
        html = html.split('\n').map(line => {
            line = line.trim();
            if (!line) return '';
            if (line.startsWith('<h') || line.startsWith('<ul') || line.startsWith('<ol') || line.startsWith('<li') || line.startsWith('<blockquote') || line.startsWith('<hr') || line.startsWith('<pre')) return line;
            if (!line.startsWith('<')) return '<p>' + line + '</p>';
            return line;
        }).join('\n');
        return html;
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        try {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
        } catch(e) { return dateStr; }
    }

    function renderBlogGrid() {
        const grid = document.getElementById('blog-grid');
        const empty = document.getElementById('blog-empty');
        if (blogPosts.length === 0) {
            grid.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }
        grid.classList.remove('hidden');
        empty.classList.add('hidden');
        grid.innerHTML = blogPosts.map((post, i) => `
            <div onclick="showArticle(${i})" class="group cursor-pointer">
                <div class="aspect-video bg-surface-container-highest rounded-2xl mb-6 overflow-hidden">
                    ${post.image ? '<img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" src="' + post.image + '" alt="' + (post.title || '') + '"/>' : '<div class="w-full h-full flex items-center justify-center"><span class="material-symbols-outlined text-slate-600 text-5xl">article</span></div>'}
                </div>
                <div class="flex gap-2 mb-3 items-center">
                    <span class="text-[10px] font-black bg-primary/10 text-primary px-2 py-1 rounded uppercase tracking-wider">${post.tag || 'GERAL'}</span>
                    <span class="text-[10px] text-slate-500">${formatDate(post.date)}</span>
                </div>
                <h4 class="text-xl font-bold mb-3 group-hover:text-primary transition-colors leading-tight">${post.title || 'Sem título'}</h4>
                <p class="text-sm text-slate-400 mb-4 line-clamp-2">${post.summary || ''}</p>
                <span class="text-primary font-bold text-sm flex items-center gap-2">Ler artigo <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">north_east</span></span>
            </div>
        `).join('');
    }

    function showArticle(index) {
        const post = blogPosts[index];
        if (!post) return;
        document.getElementById('blog-list-view').classList.add('hidden');
        document.getElementById('blog-article-view').classList.remove('hidden');
        document.getElementById('article-hero-img').src = post.image || '';
        document.getElementById('article-hero').style.display = post.image ? '' : 'none';
        document.getElementById('article-tag').textContent = post.tag || 'GERAL';
        document.getElementById('article-date').textContent = formatDate(post.date);
        document.getElementById('article-title').textContent = post.title || 'Sem título';
        document.getElementById('article-summary').textContent = post.summary || '';
        document.getElementById('article-content').innerHTML = mdToHtml(post.content);
        document.title = (post.title || 'Artigo') + ' - Blog Sinapta';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        history.pushState({ article: index }, '', '#artigo-' + index);
    }

    function showBlogList() {
        document.getElementById('blog-article-view').classList.add('hidden');
        document.getElementById('blog-list-view').classList.remove('hidden');
        document.title = 'Blog - Sinapta';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        history.pushState({}, '', 'blog.html');
    }

    // Handle browser back button
    window.addEventListener('popstate', (e) => {
        if (e.state && e.state.article !== undefined) {
            showArticle(e.state.article);
        } else {
            showBlogList();
        }
    });

    document.addEventListener('DOMContentLoaded', async () => {
        // Load from Supabase
        try {
            const res = await fetch(SUPABASE_URL + '/rest/v1/site_settings?select=*', {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
            });
            if (res.ok) {
                const data = await res.json();
                data.forEach(row => {
                    if (row.value && row.value.data !== null) {
                        localStorage.setItem(row.id, row.value.data);
                    }
                });
            }
        } catch(e) { console.warn('Supabase load error:', e); }

        // Load blog posts
        try {
            const saved = localStorage.getItem('sinapta_blog_posts');
            if (saved) blogPosts = JSON.parse(saved);
        } catch(e) {}

        // Load logo
        const savedLogo = localStorage.getItem('sinapta_logo');
        if (savedLogo) {
            document.querySelectorAll('.dynamic-logo').forEach(img => { img.src = savedLogo; img.classList.remove('hidden'); });
            document.querySelectorAll('.dynamic-logo-text').forEach(txt => { txt.classList.add('hidden'); });
        }

        renderBlogGrid();

        // Check URL hash for direct article link
        const hash = window.location.hash;
        if (hash && hash.startsWith('#artigo-')) {
            const idx = parseInt(hash.replace('#artigo-', ''));
            if (!isNaN(idx) && idx >= 0 && idx < blogPosts.length) {
                showArticle(idx);
            }
        }
    });
</script>
</body>
</html>
